[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collecte-backend"
version = "0.1.0"
description = "API et pipeline de la plateforme de collecte documentaire (sujet 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "apscheduler>=3.10",
    # docintel-ml installe en mode editable : pip install -e ../ml
]

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "httpx", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
