[project]
name = "datagen"
version = "0.1.0"
description = "Generateur de documents fictifs pour le corpus d'entrainement"
requires-python = ">=3.11"
dependencies = [
    "faker>=28.0",
    "jinja2>=3.1",
    "pillow>=10.4",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
datagen = "generate:main"
