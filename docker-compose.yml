services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/.storage
    environment:
      - JWT_SECRET=change-me-in-production
      - CLASSIFICATION_MIN_CONFIDENCE=0.80
      - CONSULTANT_INVITE_CODE=${CONSULTANT_INVITE_CODE:-}

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  storage:
  frontend_modules:
